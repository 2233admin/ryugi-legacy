<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><title>Empty</title><style>:root{--ink:#333;--muted:#85817c;--paper:#fff;--bg:#f3f2f0;--border:#dedcd7;--block:#f2f1ee;--alert:#f7eee4}@media (prefers-color-scheme:dark){:root{--ink:#e5e5e5;--muted:#a0a0a0;--paper:#292929;--bg:#1c1c1c;--border:#424242;--block:#353535;--alert:#3b342e}}rect{stroke-width:.8;vector-effect:non-scaling-stroke}</style><rect width="600" height="360" x="0" y="0" fill="var(--bg)" stroke="none"/></svg>