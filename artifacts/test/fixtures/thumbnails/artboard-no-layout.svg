<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><title>No layout</title><style>:root{--ink:#333;--muted:#85817c;--paper:#fff;--bg:#f3f2f0;--border:#dedcd7;--block:#f2f1ee;--alert:#f7eee4}@media (prefers-color-scheme:dark){:root{--ink:#e5e5e5;--muted:#a0a0a0;--paper:#292929;--bg:#1c1c1c;--border:#424242;--block:#353535;--alert:#3b342e}}text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif}rect{stroke-width:.8;vector-effect:non-scaling-stroke}</style><rect width="600" height="360" x="0" y="0" fill="var(--bg)" stroke="none"/><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="var(--border)"/></pattern></defs><rect width="600" height="360" x="0" y="0" fill="url(#dots)" stroke="none"/><g transform="translate(22 76.26865671641791) scale(0.41492537313432837)"><rect width="640" height="400" x="0" y="0" fill="var(--paper)" stroke="var(--border)"/><text x="0" y="-12.05" fill="var(--muted)" font-size="14.46" font-weight="400">A</text><rect width="640" height="400" x="700" y="100" fill="var(--paper)" stroke="var(--border)"/><text x="700" y="87.95" fill="var(--muted)" font-size="14.46" font-weight="400">B</text></g></svg>