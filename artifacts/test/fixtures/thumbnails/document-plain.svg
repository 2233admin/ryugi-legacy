<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><title>Plain &amp; simple</title><style>:root{--ink:#333;--muted:#85817c;--paper:#fff;--bg:#f3f2f0;--border:#dedcd7;--block:#f2f1ee;--alert:#f7eee4}@media (prefers-color-scheme:dark){:root{--ink:#e5e5e5;--muted:#a0a0a0;--paper:#292929;--bg:#1c1c1c;--border:#424242;--block:#353535;--alert:#3b342e}}text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif}rect{stroke-width:.8;vector-effect:non-scaling-stroke}</style><style>:root{--desk:#eaeef0;--edge:none}@media (prefers-color-scheme:dark){:root{--desk:#202427;--edge:#3a3a3a}}</style><rect width="600" height="360" x="0" y="0" fill="var(--desk)" stroke="none"/><defs><filter id="lift" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#1d3540" flood-opacity=".12" stdDeviation="14"/></filter></defs><g><g transform="rotate(-3 300 288) translate(0 22)"><rect width="444" height="540" x="78" y="18" fill="var(--paper)" stroke="var(--edge)" filter="url(#lift)"/><text x="104" y="47" fill="var(--ink)" font-size="18" font-weight="650">Plain &amp; simple</text><text x="104" y="81" fill="var(--ink)" font-size="9" font-weight="400">没有标题的文档，第一块就是段落。</text><text x="104" y="101.5" fill="var(--ink)" font-size="9" font-weight="400">第二段。</text></g></g></svg>